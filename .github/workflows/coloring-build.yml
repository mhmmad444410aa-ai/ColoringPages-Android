name: Build Coloring Pages 1.2.0 signed APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ColoringPages_Source.zip'
      - '.github/workflows/coloring-build.yml'
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract the Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s ColoringPages_Source.zip || { echo "::error::Upload the named ZIP to the repository root"; exit 1; }
          mkdir -p source
          unzip -q ColoringPages_Source.zip -d source
          test -f source/ColoringPages/gradlew
          chmod +x source/ColoringPages/gradlew
          grep -Rq 'k1i3em3bm0' source/ColoringPages/app/src/main/java
          grep -Rq 's9jruxhcil' source/ColoringPages/app/src/main/java
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile, test and sign APK/AAB
        working-directory: source/ColoringPages
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $v"
              exit 1
            fi
          done
          export RELEASE_STORE_FILE="$RUNNER_TEMP/coloring-release.jks"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/signature.txt"
          if ! grep -qi '183d97970c11c9705ca6e5b3773c2839125ba918595f9ce879757d37aaeb57d4' "$RUNNER_TEMP/signature.txt"; then
            echo "::error::Signing certificate differs from original 1.1.0 release"
            exit 1
          fi
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: ColoringPages-1.2.0-signed-release
          path: |
            source/ColoringPages/app/build/outputs/apk/release/app-release.apk
            source/ColoringPages/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            source/ColoringPages/app/build/reports/
            source/ColoringPages/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
