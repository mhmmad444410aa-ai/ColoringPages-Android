name: Build Coloring Pages 1.2.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ColoringPages_Source.zip'
      - '.github/workflows/coloring-build.yml'
      - '.github/patches/**'
permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract project and verify ad IDs
        shell: bash
        run: |
          set -euo pipefail
          test -s ColoringPages_Source.zip
          mkdir -p source
          unzip -q ColoringPages_Source.zip -d source
          cp .github/patches/ChildSafeBanner.kt source/ColoringPages/app/src/main/java/com/mhmmad/coloringpages/ads/ChildSafeBanner.kt
          python3 .github/patches/remove_ad_choice.py
          sed -i 's/it=="android.permission.INTERNET" || //; s/offlinePackageDeclaresNoNetworkOrDangerousPermissions/appWithAdsDeclaresNoDangerousPermissions/' source/ColoringPages/app/src/test/java/com/mhmmad/coloringpages/StorageAndGraphicsTest.kt
          test -f source/ColoringPages/gradlew
          chmod +x source/ColoringPages/gradlew
          grep -Rq 'k1i3em3bm0' source/ColoringPages/app/src/main/java
          grep -Rq 's9jruxhcil' source/ColoringPages/app/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test APK
        working-directory: source/ColoringPages
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ColoringPages-1.2.0-debug-APK
          path: source/ColoringPages/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Run unit tests
        working-directory: source/ColoringPages
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Collect Android signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/zipalign
      - name: Upload signing tools for offline release signing
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-signing-tools
          path: signing-tools/
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned release APK
        working-directory: source/ColoringPages
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Upload unsigned release APK for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: ColoringPages-1.2.0-unsigned-release
          path: source/ColoringPages/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Signing not configured: add the four Actions secrets, then rerun this workflow.'
          fi
      - name: Extract project
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p source
          unzip -q ColoringPages_Source.zip -d source
          cp .github/patches/ChildSafeBanner.kt source/ColoringPages/app/src/main/java/com/mhmmad/coloringpages/ads/ChildSafeBanner.kt
          python3 .github/patches/remove_ad_choice.py
          sed -i 's/it=="android.permission.INTERNET" || //; s/offlinePackageDeclaresNoNetworkOrDangerousPermissions/appWithAdsDeclaresNoDangerousPermissions/' source/ColoringPages/app/src/test/java/com/mhmmad/coloringpages/StorageAndGraphicsTest.kt
          chmod +x source/ColoringPages/gradlew
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.signing.outputs.available == 'true'
      - name: Install SDK
        if: steps.signing.outputs.available == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.available == 'true'
      - name: Sign APK and AAB
        if: steps.signing.outputs.available == 'true'
        working-directory: source/ColoringPages
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export RELEASE_STORE_FILE="$RUNNER_TEMP/coloring-release.jks"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/signature.txt"
          cat "$RUNNER_TEMP/signature.txt"
          grep -qi '183d97970c11c9705ca6e5b3773c2839125ba918595f9ce879757d37aaeb57d4' "$RUNNER_TEMP/signature.txt" || { echo "::error::Signing certificate mismatch"; exit 1; }
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed release
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ColoringPages-1.2.0-signed-APK-AAB
          path: |
            source/ColoringPages/app/build/outputs/apk/release/app-release.apk
            source/ColoringPages/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
